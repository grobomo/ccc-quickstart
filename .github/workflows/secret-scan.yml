name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets and personal paths
        run: |
          FAIL=0
          SCAN_TYPES="--include=*.py --include=*.js --include=*.json --include=*.md --include=*.sh --include=*.yaml --include=*.yml"

          # Personal paths (patterns loaded from env to avoid self-match)
          PERSONAL_PATTERN="C:/Users/joel""g|OneDrive - Trend""Micro|joel-gins""berg|joel""test"
          if grep -rn "$PERSONAL_PATTERN" $SCAN_TYPES . --exclude-dir=.github 2>/dev/null; then
            echo "::error::Personal paths found"
            FAIL=1
          fi

          # API keys and tokens
          SECRET_TYPES="--include=*.py --include=*.js --include=*.json --include=*.sh --include=*.yaml --include=*.yml --include=*.env"
          if grep -rn "sk-ant-api\|ghp_[A-Za-z0-9]\{36\}\|AKIA[A-Z0-9]\{16\}" $SECRET_TYPES . --exclude-dir=.github 2>/dev/null; then
            echo "::error::Potential secrets found"
            FAIL=1
          fi

          exit $FAIL
